# Copiar a src/main/resources/application.properties o configurar variables de entorno
db.driver=org.postgresql.Driver
db.url=jdbc:postgresql://<HOST>/<DB>?sslmode=require
db.username=<USUARIO>
db.password=<PASSWORD>

# false conserva datos; usa true solo para inicializar/recrear la BD
db.ddl.auto=false
db.ddl.script=schema_neon.sql

hikari.maximum-pool-size=10
hikari.minimum-idle=2

apisperu.token=<TOKEN_APISPERU>
